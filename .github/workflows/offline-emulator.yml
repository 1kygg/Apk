name: Consta — interface Android offline
on:
  push:
    branches: [codex/consta-native]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consta-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-emulator:
    name: Perfil e pontuação sem internet no Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_ABIS: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test --workspace @consta/mobile
      - name: Compilar APK x86_64 para emulador
        run: npm run android:apk
      - name: Preparar Android 35 e aceleração KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sdkmanager 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name consta_offline --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
      - name: Iniciar emulador e executar interface offline real
        shell: bash
        run: |
          mkdir -p artifacts/emulator
          emulator -avd consta_offline -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none -memory 2048 > artifacts/emulator/emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 install -r artifacts/android/consta-internal.apk
          python3 scripts/test-android-offline.py --serial emulator-5554 --reset-data --timeout 420
      - name: Guardar evidência de emulador
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consta-offline-emulator-${{ github.run_number }}
          path: artifacts/emulator/
          retention-days: 2
          if-no-files-found: warn
