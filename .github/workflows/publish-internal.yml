name: Consta — download do APK verificado
on:
  push:
    branches: [codex/consta-apk-download]
    paths: [.github/workflows/publish-internal.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42604239761'
      SOURCE_SHA: '746bd0d6bf0689dade880eb6ba54c7164616526f'
      RELEASE_TAG: consta-offline-v1.1.0-746bd0d
    steps:
      - name: Confirmar build e revisão de origem
        shell: bash
        run: |
          gh run view "$SOURCE_RUN" --json headSha,conclusion > run.json
          node -e 'const r=require("./run.json");if(r.headSha!==process.env.SOURCE_SHA||r.conclusion!=="success")throw Error("Build de origem não confirmado");'
      - name: Baixar e verificar o APK já compilado
        shell: bash
        run: |
          gh run download "$SOURCE_RUN" --name consta-offline-android-11 --dir release
          (cd release && sha256sum -c SHA256SUMS.txt)
          sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apk_signer="$(find "$sdk_dir/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk_signer"
          "$apk_signer" verify --verbose --print-certs release/consta-internal.apk > release/apk-verification.txt
          "$(dirname "$apk_signer")/aapt" dump badging release/consta-internal.apk > release/apk-package.txt
          python3 - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('release/consta-internal.apk') as apk:
            assert apk.testzip() is None
            names=apk.namelist()
            assert 'AndroidManifest.xml' in names and 'classes.dex' in names
            assert 'assets/index.android.bundle' in names
            assert any(n.startswith('lib/arm64-v8a/') for n in names)
            assert not any(n.startswith(('lib/x86/','lib/x86_64/','lib/armeabi-v7a/')) for n in names)
          package=open('release/apk-package.txt').read()
          assert "name='app.consta.mobile'" in package
          assert "versionName='1.1.0'" in package and "versionCode='2'" in package
          assert "sdkVersion:'26'" in package
          assert "targetSdkVersion:'36'" in package
          assert not re.search(r"uses-permission: name='android.permission.(CAMERA|RECORD_AUDIO|READ_CONTACTS|ACCESS_BACKGROUND_LOCATION)'",package)
          print('APK íntegro, assinatura validada, pacote/SDK e arquitetura confirmados.')
          PY
      - name: Disponibilizar download de teste interno
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Consta 1.1.0 local para Android arm64, Android 8.0 ou superior. Abra o APK, informe nome/apelido e foto opcional. Não precisa de login, servidor, OAuth ou internet para perfil, treinos, registros e pontuação pessoal.

          O GPS depende de localização e sinal do aparelho. O traçado dos pontos é desenhado offline, sem mapa de ruas. Compartilhar por outro aplicativo pode exigir a conexão daquele aplicativo. Não há ranking sincronizado entre celulares nem recuperação na nuvem.

          Verificado: TypeScript e 177 testes no CI, incluindo perfil/SQLite/pontos/cardio com adaptadores, compilação Android, checksum e assinatura. Interface verificada em Android 35/x86_64 com modo avião: criação de perfil, registro manual de futebol, 1 ponto e persistência após fechar/reabrir. Evidência: https://github.com/1kygg/Apk/actions/runs/42608028196 . O teste usa o mesmo código de aplicativo do APK arm64; foto não foi selecionada. Sensores, fotos/permissões físicas, tela bloqueada, iOS, acessibilidade e desempenho em aparelho continuam sem verificação física.

          Baixe consta-offline.apk e abra no celular para instalar. Assinatura de desenvolvimento para teste interno, sem publicação em loja. Nenhuma chave privada ou conta de demonstração é publicada. Foto e registros ficam neste aparelho; apagar dados/desinstalar pode remover o histórico. Horários são os do aparelho e conclusões são autodeclaradas.

          Código: 746bd0d6bf0689dade880eb6ba54c7164616526f. Instruções em README.md e docs/SETUP.md. Nenhum serviço pago foi ativado.
          NOTES
          mv release/consta-internal.apk release/consta-offline.apk
          sed -i 's/consta-internal.apk/consta-offline.apk/' release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json targetCommitish > existing-release.json 2>/dev/null; then
            node -e 'if(require("./existing-release.json").targetCommitish!==process.env.SOURCE_SHA)throw Error("A release não corresponde à revisão verificada");'
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release/consta-offline.apk release/SHA256SUMS.txt release/signing-certificate.txt release/INSTALL.txt release/apk-verification.txt release/apk-package.txt --target "$SOURCE_SHA" --title 'Consta Offline 1.1.0 — perfil e pontos sem login' --notes-file release-notes.md --prerelease
          fi
      - name: Preservar evidência da interface offline
        shell: bash
        run: |
          test "$(gh run view 42608028196 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 42608028196 --json headSha --jq .headSha)" = ec9d1613243a53e93c9f66da819682505696189b
          gh run download 42608028196 --name consta-offline-emulator-3 --dir evidence
          node -e 'const r=require("./evidence/result.json");if(r.success!==true)throw Error("Teste offline não confirmado");'
          cp evidence/result.json evidence/emulator-verification.json
          gh release upload "$RELEASE_TAG" evidence/emulator-verification.json evidence/01-local-point-offline.png evidence/02-local-point-after-restart.png --clobber
