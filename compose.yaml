services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: consta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - consta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consta -d consta"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://consta:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/consta
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh","-c","node dist/migrate.js && node dist/server.js"]
volumes:
  consta_postgres:
